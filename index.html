<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>عازمك على قهوة</title>
  <style>
    :root{--bg:#f4ecdf;--paper:#fffaf1;--olive:#68715e;--olive-dark:#485044;--latte:#b9865a;--peach:#d9a891;--ink:#493b30;--line:#dec9ad}*{box-sizing:border-box}html{min-height:100%;background:#ddd1c1}body{margin:0;min-height:100%;background:#ddd1c1;color:var(--ink);font-family:Tahoma,Arial,sans-serif;overflow-x:hidden;overflow-y:auto}.app{position:relative;width:100%;max-width:430px;min-height:100vh;min-height:100svh;min-height:100dvh;margin:auto;overflow-x:hidden;overflow-y:visible;background:linear-gradient(45deg,#ede2d1 25%,transparent 25%),linear-gradient(-45deg,#ede2d1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ede2d1 75%),linear-gradient(-45deg,transparent 75%,#ede2d1 75%),var(--bg);background-size:36px 36px;background-position:0 0,0 18px,18px -18px,-18px 0;padding:11px max(11px,env(safe-area-inset-right)) max(11px,env(safe-area-inset-bottom)) max(11px,env(safe-area-inset-left))}.screen{display:none;min-height:calc(100vh - 22px);min-height:calc(100svh - 22px);min-height:calc(100dvh - 22px);align-items:center;justify-content:center;position:relative}.screen.active{display:flex;animation:enter .45s ease both}.paper{position:relative;width:96%;min-height:calc(100vh - 38px);min-height:calc(100svh - 38px);min-height:calc(100dvh - 38px);padding:24px 23px 27px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:31px;background:linear-gradient(150deg,#fffdf8,#fff4e6);box-shadow:0 15px 36px #60482724,inset 0 0 0 5px #fffaf244}.paper:before{content:"";position:absolute;inset:9px;border:1px dashed #d7b995;border-radius:24px;pointer-events:none}.paper>*{position:relative;z-index:1}.brand{display:flex;align-items:center;gap:7px;margin:0 0 25px;font:28px Georgia,serif;letter-spacing:1px;color:var(--olive)}.brand small{display:block;font:9px Tahoma,Arial,sans-serif;letter-spacing:0;color:#a17159;margin-top:2px}.brand-flower{width:24px;color:var(--olive)}.string{position:absolute;z-index:2;top:0;left:-6%;width:112%;height:48px;color:#9b7654}.bow{position:absolute;z-index:2;top:18px;right:10px;width:74px;color:var(--olive);opacity:.7}.stars{position:absolute;color:#bd8656;opacity:.74}.s1{top:79px;left:27px;width:27px}.s2{top:113px;right:31px;width:18px}.s3{bottom:95px;left:27px;width:20px}.leaves{position:absolute;color:var(--olive);opacity:.55}.l1{top:137px;right:-17px;width:93px;transform:rotate(-12deg)}.l2{bottom:40px;left:-19px;width:95px;transform:rotate(18deg)}.intro h1{margin:2px 0 10px;font:42px Georgia,serif;color:var(--ink);font-weight:500}.intro .intro-text{margin:0 0 22px;color:#785f4e;font-size:15px;line-height:1.9}.coffee-scene{width:230px;margin:0 0 14px;color:var(--latte);filter:drop-shadow(0 9px 7px #6b4c2920)}.choices{width:220px;display:grid;gap:12px;margin:3px 0 48px;position:relative}.choice{height:47px;border:0;border-radius:999px;font:16px Tahoma,Arial,sans-serif;cursor:pointer;touch-action:manipulation;transition:transform .2s,box-shadow .2s}.yes{background:var(--olive);color:#fffdf8;box-shadow:0 5px 0 #505747}.yes:active{transform:translateY(3px);box-shadow:0 2px 0 #505747}.no{position:relative;background:#f0ddc6;border:1px solid #d7b08c;color:#755a47;box-shadow:0 4px 0 #d7b08c;will-change:transform}.plea{position:absolute;top:112px;left:50%;width:260px;transform:translateX(-50%) translateY(6px);margin:0;padding:9px 13px;border-radius:14px;background:#fffaf1;border:1px solid #e4c5a5;color:#8b654d;font-size:13px;line-height:1.55;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 13px #78563115}.plea.show{opacity:1;transform:translateX(-50%) translateY(0)}.accept h1{font:34px Georgia,serif;color:var(--olive-dark);font-weight:500;margin:2px 0 7px}.accept p{font-size:15px;line-height:1.85;color:#755c4b;margin:0}.invite-art{width:250px;margin:7px 0 13px;color:var(--latte)}.details{width:100%;margin:8px 0 18px;padding:16px 8px;border-top:1px solid #e2cdb4;border-bottom:1px solid #e2cdb4;display:grid;grid-template-columns:repeat(3,1fr)}.details div+div{border-right:1px solid #e2cdb4}.details b{display:block;font-size:12px;color:var(--olive-dark);margin-bottom:7px}.details span{font-size:12px;color:#755c4b}.confirm{width:190px}.note{font:13px Georgia,serif!important;color:#916a52!important}.heart{position:fixed;top:-30px;z-index:10;pointer-events:none;font:25px Georgia,serif;animation:rain 3.5s linear forwards}.heart:after{content:'♡'}@keyframes rain{to{transform:translate(var(--x),108dvh) rotate(400deg);opacity:.8}}@keyframes enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}@media(max-height:650px){.paper{min-height:calc(100svh - 24px);min-height:calc(100dvh - 24px);padding:20px}.brand{margin-bottom:12px}.string{height:35px}.intro h1{font-size:36px}.coffee-scene{width:185px;margin-bottom:7px}.intro .intro-text{margin-bottom:13px}.invite-art{width:205px;margin:0 0 8px}.details{margin:5px 0 11px}.accept h1{font-size:30px}}
  </style>
</head>
<body><main class="app">
  <section id="ask" class="screen active"><div class="paper intro">
    <svg class="string" viewBox="0 0 450 52" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 8C116 24 314 24 450 2"/><path d="M54 12v21m70-11v21m182-20v20m77-29v22"/><circle cx="54" cy="38" r="6" fill="#e7bca6"/><circle cx="124" cy="48" r="6" fill="#d3ac78"/><circle cx="306" cy="48" r="6" fill="#e7bca6"/><circle cx="383" cy="41" r="6" fill="#d3ac78"/></svg>
    <svg class="bow" viewBox="0 0 100 75" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M48 36C31 5 2 12 5 30c3 19 25 22 43 8ZM51 36c18-31 47-24 44-6-3 19-25 22-43 8Z" fill="currentColor" fill-opacity=".13"/><circle cx="50" cy="37" r="9" fill="currentColor" fill-opacity=".2"/><path d="m44 45-12 23m24-23 12 23"/></svg>
    <svg class="stars s1" viewBox="0 0 40 40" fill="currentColor"><path d="m20 2 4 12 12 2-10 8 3 13-9-7-10 7 4-13-10-8 12-2z"/></svg><svg class="stars s2" viewBox="0 0 40 40" fill="currentColor"><path d="m20 2 4 12 12 2-10 8 3 13-9-7-10 7 4-13-10-8 12-2z"/></svg>
    <svg class="leaves l1" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 103C38 68 59 37 95 9"/><path d="M42 69c-23 0-20-22-1-18M58 51c-2-22 21-20 18-1M30 87c-21 4-24-17-5-18M72 36c3-20 23-14 16 4" fill="currentColor" fill-opacity=".15"/></svg>
    <p class="brand"><svg class="brand-flower" viewBox="0 0 30 40" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 39V9M15 19 7 13m8 15 9-8"/><path d="M15 9c-7-6 1-13 5-6 5-5 10 4 2 8M7 13C0 6 8 2 11 9"/></svg><span>Letters<small>make it personal.</small></span></p>
    <svg class="coffee-scene" viewBox="0 0 270 170" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M41 137h186"/><ellipse cx="127" cy="142" rx="87" ry="17" fill="currentColor" fill-opacity=".14"/><path d="M59 73h123v43c0 25-20 36-62 36s-61-11-61-36z" fill="currentColor" fill-opacity=".18"/><path d="M182 83h22c28 0 27 48 0 48h-22"/><ellipse cx="120" cy="73" rx="62" ry="13" fill="#fff6e9"/><ellipse cx="120" cy="72" rx="48" ry="8"/><path d="M98 72c7-10 23-10 30 0 7-10 23-10 30 0"/><path d="M90 49c-8-11 8-17 1-28m31 27c-8-11 8-17 1-28m28 29c-8-11 8-17 1-28"/><path d="M29 142c7-16 25-16 33 0M202 141c7-16 25-16 33 0"/><circle cx="48" cy="151" r="7" fill="currentColor" fill-opacity=".3"/><circle cx="218" cy="150" r="7" fill="currentColor" fill-opacity=".3"/></svg>
    <h1>نطلع نتقهوى؟</h1><p class="intro-text">عندي لك قهوة وسوالف على كيف كيفك.</p>
    <div class="choices"><button class="choice yes" onclick="acceptInvite()">إيه، أكيد ♡</button><button id="no" class="choice no" onmouseenter="moveNo(event)" onpointerdown="moveNo(event)">لا، للأسف</button><p id="plea" class="plea"></p></div>
  </div></section>
  <section id="accepted" class="screen"><div class="paper accept">
    <svg class="string" viewBox="0 0 450 52" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 8C116 24 314 24 450 2"/><path d="M54 12v21m70-11v21m182-20v20m77-29v22"/><circle cx="54" cy="38" r="6" fill="#e7bca6"/><circle cx="124" cy="48" r="6" fill="#d3ac78"/><circle cx="306" cy="48" r="6" fill="#e7bca6"/><circle cx="383" cy="41" r="6" fill="#d3ac78"/></svg>
    <p class="brand"><svg class="brand-flower" viewBox="0 0 30 40" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 39V9M15 19 7 13m8 15 9-8"/><path d="M15 9c-7-6 1-13 5-6 5-5 10 4 2 8M7 13C0 6 8 2 11 9"/></svg><span>Letters<small>make it personal.</small></span></p>
    <h1>متحمسة أشوفك!</h1><p>تم اعتماد الموعد رسميًا.</p>
    <svg class="invite-art" viewBox="0 0 280 170" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 147h245"/><path d="M45 146V82c0-10 9-18 20-18h53c12 0 21 8 21 18v64" fill="#fffaf0" fill-opacity=".65"/><path d="M45 82 91 122 138 82"/><path d="M45 146 79 111m59 35-34-35"/><circle cx="91" cy="119" r="13" fill="#e7bca6"/><path d="M87 119h8m-4-4v8" stroke="#fffaf1"/><path d="M181 49v98M181 73c-25 0-27-26-5-22M181 93c27 0 28-27 5-22M181 112c-24 0-25 24-4 21"/><path d="M199 147V85c0-10 8-18 18-18h25c10 0 18 8 18 18v62" fill="#798064" fill-opacity=".13"/><path d="M199 87h61"/><path d="m215 111 10 10 20-26" stroke="#798064" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="details"><div><b>اليوم</b><span>الخميس</span></div><div><b>التاريخ</b><span>٢٢ أغسطس</span></div><div><b>الوقت</b><span>٧:٣٠ مساءً</span></div></div>
    <p class="note">قهوة دافئة، ومكان هادي، ووقت حلو لنا.</p><button class="choice yes confirm" onclick="rainHearts()">تم التأكيد ♡</button>
  </div></section>
</main><div id="rain"></div><script>
function moveNo(e){if(e)e.preventDefault();const b=document.getElementById('no'),p=document.getElementById('plea');const phrases=['بليز… كوب قهوة واحد بس، على حسابي!','لا ترفضين بسرعة… عندي لك أحلى قهوة.','طيب بس ٢٠ دقيقة سوالف وقهوة؟'];const amount=Math.random()>.5?62:-62;b.style.transform='translateX('+amount+'px) rotate('+(amount/16)+'deg)';p.textContent=phrases[Math.floor(Math.random()*phrases.length)];p.classList.add('show');clearTimeout(window.noTimer);window.noTimer=setTimeout(()=>{b.style.transform='translateX(0)';p.classList.remove('show')},1800)}
function acceptInvite(){document.getElementById('ask').classList.remove('active');document.getElementById('accepted').classList.add('active');rainHearts()}
function rainHearts(){const r=document.getElementById('rain');r.innerHTML='';const c=['#e7bca6','#c7a177','#9ca58a'];for(let i=0;i<55;i++){const h=document.createElement('i');h.className='heart';h.style.left=Math.random()*100+'vw';h.style.color=c[i%3];h.style.fontSize=(18+Math.random()*16)+'px';h.style.setProperty('--x',(Math.random()*140-70)+'px');h.style.animationDelay=(Math.random()*.8)+'s';r.appendChild(h)}}
</script></body></html>
